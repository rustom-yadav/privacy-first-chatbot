services:
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      ollama:
        condition: service_started
      ollama-pull-model:
        condition: service_completed_successfully
    volumes:
      # Data persistence only — no code mounts
      - chromadb_data:/app/chroma_db
      - uploaded_docs:/app/uploaded_docs
      - local_db:/app/local_db
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  ollama-pull-model:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
    command: >
      sh -c "
        echo \"Waiting for Ollama server to be ready...\";
        while ! ollama list > /dev/null 2>&1; do
          sleep 2;
        done;
        echo \"Pulling model ${LLM_MODEL}...\";
        ollama pull ${LLM_MODEL};
        echo \"Model ${LLM_MODEL} is ready!\";
      "

volumes:
  ollama_models:
  chromadb_data:
  uploaded_docs:
  local_db: